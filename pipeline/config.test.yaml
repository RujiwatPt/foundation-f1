# Tiny end-to-end smoke config: fabricated stand-in base + local parquet only.
# No gated download, no HF auth. Run with:  make smoke
base:
  model_id: "stand-in"
  local_dir: "artifacts/base-test"
  trust_remote_code: true
prune:
  mode: "reinit"
  target_params: 5_000_000
  arch:
    hidden_size: 64
    intermediate_size: 128
    num_hidden_layers: 2
    num_attention_heads: 4
    num_key_value_heads: 2
    max_position_embeddings: 512
    tie_word_embeddings: true
  output_dir: "artifacts/model-test-init"
data:
  hf_datasets: []
  local_parquet:
    - "../data/ThaiLLMRepo_parquet/law.parquet"
  text_field: "text"
  sequence_length: 128
  num_proc: 2
  seed: 42
  validation_fraction: 0.02
  tokenized_dir: "artifacts/tokenized-test"
  max_train_docs: 200
train:
  output_dir: "artifacts/checkpoints-test"
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  warmup_ratio: 0.1
  max_steps: 3
  num_train_epochs: null
  lr_scheduler_type: "cosine_with_min_lr"
  bf16: false
  gradient_checkpointing: false
  logging_steps: 1
  save_steps: 3
  save_total_limit: 1
  eval_steps: 3
  dataloader_num_workers: 0
  seed: 42
  resume: false
  report_to: "none"
  run_name: "smoke"
eval:
  prompts:
    - "ประเทศไทย"
  max_new_tokens: 8
