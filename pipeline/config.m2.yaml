# =============================================================================
# Foundation-F1 — Apple Silicon (M2 Pro) profile
#
# Use with:   make CONFIG=config.m2.yaml all
#         or: F1_CONFIG=config.m2.yaml python src/03_pretrain.py
#
# REALITY CHECK
#   A true from-scratch 1B pretrain does NOT fit an M2 Pro. fp32 Adam on 1B
#   params alone is ~16 GB (params+grads+optimizer state) before activations,
#   and MPS has no bf16/8-bit training to shrink that. So this profile builds a
#   smaller (~350M) model that genuinely trains on 16–32 GB unified memory — for
#   development, debugging, and small experiments. Run the real 1B job on a
#   CUDA GPU with the default config.yaml.
#
#   Everything here is MPS-tuned: fp32 (set automatically by the scripts on MPS),
#   no flash-attn/deepspeed, single dataloader worker, modest tokenization procs.
# =============================================================================

base:
  model_id: "google/gemma-4-E2B-it"
  local_dir: "artifacts/base"
  trust_remote_code: true

prune:
  mode: "reinit"                 # structured loads the full ~5B base -> too big for M2
  target_params: 350_000_000     # fits and trains on M2 Pro
  arch:
    hidden_size: 1024
    intermediate_size: 4096
    num_hidden_layers: 16        # overridden by the search to hit target_params
    num_attention_heads: 8
    num_key_value_heads: 2
    max_position_embeddings: 4096
    tie_word_embeddings: true
  output_dir: "artifacts/model-m2-init"

data:
  hf_datasets:
    - id: "SPAISS6F1/spai-ss6-pythainlp-pretrain-collection"
      split: "train"
      text_field: "text"
    - id: "SPAISS6F1/spai-ss6-llm-1b-thai-corpus"
      split: "train"
      text_field: "text"
  local_parquet:
    - "../data/ThaiLLMRepo_parquet/*.parquet"
  text_field: "text"
  sequence_length: 1024          # shorter context -> less activation memory
  num_proc: 4                    # M2 Pro: spawn-based mp; keep modest
  seed: 42
  validation_fraction: 0.002
  tokenized_dir: "artifacts/tokenized-m2"
  max_train_docs: 50000          # cap so data prep + epochs stay fast; null for all

train:
  output_dir: "artifacts/checkpoints-m2"
  per_device_train_batch_size: 1   # MPS memory is tight; lean on grad accumulation
  gradient_accumulation_steps: 32  # effective batch = 32
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  warmup_ratio: 0.02
  max_steps: 2000                # raise once you've confirmed it runs cleanly
  num_train_epochs: null
  lr_scheduler_type: "cosine_with_min_lr"
  bf16: false                    # forced fp32 on MPS by the scripts regardless
  gradient_checkpointing: true   # essential to fit memory on M2
  logging_steps: 5
  save_steps: 500
  save_total_limit: 2
  eval_steps: 500
  dataloader_num_workers: 0      # MPS + workers can stall; keep 0 on Mac
  seed: 42
  resume: true
  report_to: "none"
  run_name: "thai-m2-dev"

eval:
  prompts:
    - "ประเทศไทยมีเมืองหลวงคือ"
    - "ปัญญาประดิษฐ์ (AI) คือ"
  max_new_tokens: 48
